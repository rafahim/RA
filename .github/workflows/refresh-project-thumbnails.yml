name: Refresh live project thumbnails

on:
  schedule:
    # Once per day at 02:00 UTC (08:00 Bangladesh time).
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-project-thumbnails
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture all public project homepages
        run: npm run capture:projects

      - name: Commit updated thumbnails and capture dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          if git diff --cached --quiet; then
            echo "No screenshot or metadata changes to commit."
          else
            git commit -m "chore: refresh live project thumbnails"
            git push
          fi
