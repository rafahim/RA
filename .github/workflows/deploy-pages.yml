name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble and validate publish directory
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          test -s public/sitemap.xml
          test -s public/robots.txt
          mkdir -p dist/assets
          cp index.html dist/index.html
          cp -R assets/. dist/assets/
          cp -R public/. dist/
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -s dist/site.webmanifest
          python - <<'PYXML'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          sitemap = Path('dist/sitemap.xml')
          root = ET.parse(sitemap).getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns) if node.text]
          assert urls, 'No <loc> entries found in sitemap.xml'
          print('Validated sitemap URLs:', ', '.join(urls))
          print('Published root files:', ', '.join(p.name for p in Path('dist').iterdir()))
          PYXML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
