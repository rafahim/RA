name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble and validate publish directory
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          test -s sitemap.xml
          test -s robots.txt
          test -s site.webmanifest
          mkdir -p dist
          cp index.html sitemap.xml robots.txt site.webmanifest developer-badge.html CNAME .nojekyll dist/
          cp -R assets dist/assets
          test -s dist/sitemap.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/sitemap.xml'); print('sitemap.xml OK')"
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
